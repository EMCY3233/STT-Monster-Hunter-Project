<!doctype html><html lang="es"><meta charset="utf-8"><title>STT · Simulación sintética de movimiento</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'">
<style>body{font:16px system-ui;margin:24px;background:#10202b;color:#edf6fb}h1{font-size:24px}p{max-width:900px;color:#b9ccd7}button,select{font:inherit;padding:8px;background:#233e50;color:inherit;border:1px solid #7291a4;border-radius:5px}label{margin:12px;display:inline-block}input{vertical-align:middle;width:240px}canvas{display:block;width:100%;height:440px;background:#152936;border:1px solid #476272}#detail{min-height:28px}.legend{display:flex;gap:24px;flex-wrap:wrap;margin:12px 0}.ref{color:#72e6ba}.trial{color:#ffb577}</style>
<h1>Simulación sintética · reposo frente a movimiento</h1>
<p>Geometría y movimiento originales de prueba. No utiliza recursos de MH4U ni decodifica LMT. Los pesos inválidos se muestran sin validación solo para exponer su efecto; el inspector los rechaza.</p>
<label for="case">Comparación</label><select id="case"><option value="palette_swap">Paleta intercambiada</option><option value="hierarchy_order">Jerarquía en orden incorrecto</option><option value="unchecked_bad_weights">Pesos inválidos, cálculo sin validar</option></select>
<label for="time">Tiempo <input id="time" type="range" min="0" max="240" value="0" step="1"></label><button id="play">Reproducir</button><button id="reset">Reposo</button>
<div class="legend"><span class="ref">Referencia correcta</span><span class="trial">Caso con error introducido</span></div>
<canvas id="scene" role="img" aria-label="Malla sintética articulada comparada con un error controlado"></canvas><p id="detail" aria-live="polite"></p>
<script>
'use strict';const simulation=/*SIMULATION*/null;const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),time=document.getElementById('time'),choice=document.getElementById('case'),play=document.getElementById('play');let playing=false,last=0;
const all=simulation.frames_data.flatMap(f=>Object.values(f.states).flat());const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);const bounds=[Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys)];
function draw(){canvas.width=canvas.clientWidth;canvas.height=440;ctx.clearRect(0,0,canvas.width,canvas.height);const f=simulation.frames_data[+time.value],scale=Math.min((canvas.width-60)/(bounds[1]-bounds[0]),380/(bounds[3]-bounds[2]));const project=p=>[canvas.width/2+(p[0]-(bounds[0]+bounds[1])/2)*scale,220-(p[1]-(bounds[2]+bounds[3])/2)*scale];function mesh(points,color){ctx.strokeStyle=color;ctx.lineWidth=1.6;for(let i=0;i<points.length-2;i++){const a=project(points[i]),b=project(points[i+1]),c=project(points[i+2]);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.lineTo(...c);ctx.stroke()}}mesh(f.states.correct,'#72e6ba');mesh(f.states[choice.value],'#ffb577');const error=Math.max(...f.states.correct.flatMap((p,i)=>p.map((v,j)=>Math.abs(v-f.states[choice.value][i][j]))));document.getElementById('detail').textContent=f.time.toFixed(2)+' s · diferencia máxima por coordenada: '+error.toFixed(6)+' unidades sintéticas';canvas.dataset.ready='true'}
time.oninput=()=>{playing=false;play.textContent='Reproducir';draw()};choice.onchange=draw;document.getElementById('reset').onclick=()=>{playing=false;play.textContent='Reproducir';time.value=0;draw()};play.onclick=()=>{playing=!playing;play.textContent=playing?'Pausar':'Reproducir';last=performance.now()};function tick(now){if(playing&&now-last>=1000/60){const steps=Math.floor((now-last)/(1000/60));time.value=(+time.value+steps)%240;last+=steps*1000/60;draw()}requestAnimationFrame(tick)}window.onresize=draw;draw();requestAnimationFrame(tick);
</script></html>
