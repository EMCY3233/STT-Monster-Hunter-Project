name: Vita agent build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test C encoder and compatibility with Python receiver
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Ivita-agent/src vita-agent/src/telemetry.c vita-agent/tests/test_telemetry.c -o /tmp/stt-encoder-test
          /tmp/stt-encoder-test > /tmp/stt-c-packets.txt
          python -c "from stt_monitor.protocol import decode; from pathlib import Path; packets=[decode(line) for line in Path('/tmp/stt-c-packets.txt').read_bytes().splitlines()]; assert len(packets)==2; assert packets[0]['battery_pct'] is None; assert packets[1]['seq']==59; assert all(p['source']=='vita' for p in packets)"
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:2026.08-20260815
    steps:
      - uses: actions/checkout@v4
      - name: Configure and compile experimental agent
        run: |
          cmake -S vita-agent -B build/vita
          cmake --build build/vita --parallel 2
          sha256sum build/vita/stt_vita_monitor.vpk > build/vita/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: stt-vita-monitor-experimental
          path: |
            build/vita/stt_vita_monitor.vpk
            build/vita/SHA256SUMS
          retention-days: 7
