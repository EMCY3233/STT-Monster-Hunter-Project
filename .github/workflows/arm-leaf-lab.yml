name: A32 to C++17 equivalence experiment
on:
  push:
    paths: ['arm-leaf-lab/**', '.github/workflows/arm-leaf-lab.yml']
  pull_request:
    paths: ['arm-leaf-lab/**', '.github/workflows/arm-leaf-lab.yml']
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: --no-deps unicorn==2.1.4'
      - run: cmake -S arm-leaf-lab -B build/leaf -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: ctest --test-dir build/leaf -C ${{ matrix.config }} --output-on-failure
