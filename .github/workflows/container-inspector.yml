name: Container inspector
on:
  push:
    paths: ['container-inspector/**', '.github/workflows/container-inspector.yml']
  pull_request:
    paths: ['container-inspector/**', '.github/workflows/container-inspector.yml']
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: OpenSSL development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: cmake -S container-inspector -B build/inspector -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build/inspector --config ${{ matrix.build_type }}
      - run: ctest --test-dir build/inspector -C ${{ matrix.build_type }} --output-on-failure
