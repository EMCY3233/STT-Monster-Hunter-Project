name: TEX A5 decoder
on:
  push:
    paths: ['texture-decoder/**', '.github/workflows/texture-decoder.yml']
  pull_request:
    paths: ['texture-decoder/**', '.github/workflows/texture-decoder.yml']
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        build: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cmake -S texture-decoder -B build -DCMAKE_BUILD_TYPE=${{ matrix.build }}
      - run: cmake --build build --config ${{ matrix.build }}
      - run: ctest --test-dir build -C ${{ matrix.build }} --output-on-failure
