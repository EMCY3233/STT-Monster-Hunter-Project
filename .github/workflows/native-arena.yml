name: Original native PC arena
on:
  push:
    paths: ['pc-lab/**', '.github/workflows/native-arena.yml']
  pull_request:
    paths: ['pc-lab/**', '.github/workflows/native-arena.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb xauth
      - run: cmake -S pc-lab -B build/native -DSTT_NATIVE_ARENA=ON -DGLFW_BUILD_WAYLAND=OFF -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build/native --config ${{ matrix.config }}
      - name: Windows CPU contracts (hosted OpenGL not assumed)
        if: runner.os == 'Windows'
        run: ctest --test-dir build/native -C ${{ matrix.config }} --output-on-failure -E native_render_smoke
      - name: Linux CPU and Mesa OpenGL smoke
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ctest --test-dir build/native -C ${{ matrix.config }} --output-on-failure
