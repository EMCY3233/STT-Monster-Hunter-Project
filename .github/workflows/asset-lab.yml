name: STT Asset Lab PC
on:
  push:
    paths: ['asset-lab/**', '.github/workflows/asset-lab.yml']
  pull_request:
    paths: ['asset-lab/**', '.github/workflows/asset-lab.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s asset-lab/tests -v
      - run: python -m compileall -q asset-lab/stt_asset_lab
      - run: python package.py
        working-directory: asset-lab
      - uses: actions/upload-artifact@v4
        with:
          name: stt-asset-lab-${{ matrix.os }}-${{ matrix.python }}
          path: asset-lab/dist/*
          retention-days: 7
